[tool.poetry]
name = "ultra-scraper"
version = "0.1.0"
description = "Ultra-lightweight scraping API with TLS fingerprinting, memory-safe parsing, and persistent caching."
authors = []

[tool.poetry.dependencies]
python = ">=3.11"
scrapling = "0.4.12"
lxml = ">=6.1.1"
cssselect = ">=1.4.0"
orjson = ">=3.11.8"
tld = ">=0.13.2"
w3lib = ">=2.4.1"
curl-cffi = ">=0.15.0"
playwright = "1.61.0"
patchright = "1.61.2"
browserforge = ">=1.2.4"
apify-fingerprint-datapoints = ">=0.13.0"
click = ">=8.3.0"
msgspec = ">=0.21.1"
anyio = ">=4.13.0"
protego = ">=0.6.2"
fastapi = "0.115.6"
uvicorn = {extras = ["standard"], version = "0.34.0"}
pydantic = "2.10.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
